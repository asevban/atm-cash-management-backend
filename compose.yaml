services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atm_cash}
      POSTGRES_USER: ${POSTGRES_USER:-atm_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-only-change-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      CardSecurity__CardNumberHmacKey: ${CARD_NUMBER_HMAC_KEY:?Set CARD_NUMBER_HMAC_KEY to a stable secret of at least 32 bytes}
      ConnectionStrings__AtmDatabase: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-atm_cash};Username=${POSTGRES_USER:-atm_app};Password=${POSTGRES_PASSWORD:-dev-only-change-me};GSS Encryption Mode=Disable"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  postgres-data:
